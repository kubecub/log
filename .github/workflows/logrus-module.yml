name: Go module contracts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: go-modules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: ['.', 'logrus']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: false
      - name: Test the actual module including its Hook and Writer consumers
        working-directory: ${{ matrix.module }}
        run: go test -race -mod=readonly -count=1 -timeout=60s ./...
      - name: Confirm the old Writer regression is detected in an isolated copy
        if: matrix.module == 'logrus'
        shell: bash
        run: |
          cp -R logrus "$RUNNER_TEMP/logrus-regression"
          cd "$RUNNER_TEMP/logrus-regression"
          go mod edit -require=github.com/sirupsen/logrus@v1.9.1
          go mod tidy
          set +e
          go test -count=1 -run '^TestWriterContract$' -timeout=15s ./... > "$RUNNER_TEMP/logrus-regression.log" 2>&1
          regression_status=$?
          set -e
          if [ "$regression_status" -eq 0 ]; then
            cat "$RUNNER_TEMP/logrus-regression.log"
            echo 'Old Writer regression was not detected'
            exit 1
          fi
          grep -Eq -- '--- FAIL: TestWriterContract|panic: runtime error|Writer .*timed out' "$RUNNER_TEMP/logrus-regression.log"
