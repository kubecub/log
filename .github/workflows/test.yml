name: Test Makefile build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: go-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: false
      - name: Build the actual four examples using the project Makefile
        run: make build
      - name: Check each actual build artifact
        run: |
          test -x bin/example
          test -x bin/simple
          test -x bin/context
          test -x bin/vlevel
